# CamillaDSP Configuration for USB Audio Gadget → Merus Amplifier
# Raspberry Pi Zero USB Audio Device with DSP Processing
#
# Configuration validated against CamillaDSP v3.0.1 syntax
# Based on official examples from https://github.com/HEnquist/camilladsp-config

devices:
  samplerate: 48000
  chunksize: 2048
  enable_rate_adjust: true
  silence_threshold: -60
  silence_timeout: 3.0
  target_level: 2048
  adjust_period: 10

  capture:
    type: Alsa
    channels: 2
    device: "plughw:2,0"
    format: S16LE

  playback:
    type: Alsa
    channels: 2
    device: "hw:CARD=sndrpimerusamp,DEV=0"
    format: S32LE

# Bass shelf filter for low-end enhancement
filters:
  bass_shelf_120hz:
    type: Biquad
    parameters:
      type: Lowshelf
      freq: 150
      gain: 12.0
      q: 0.7

# Mixer routing both channels
mixers:
  main:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0.0
      - dest: 1
        sources:
          - channel: 1
            gain: 0.0

# Processing pipeline: Filter → Mix
pipeline:
  - type: Filter
    channels: [0,1]
    names:
      - bass_shelf_120hz
  - type: Mixer
    name: main
