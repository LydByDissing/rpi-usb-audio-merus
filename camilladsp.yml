# CamillaDSP Configuration for USB Audio Gadget → Audio Output
# Raspberry Pi Zero USB Audio Device with DSP Processing
#
# This is an EXAMPLE configuration - customize for your specific needs!
# Configuration validated against CamillaDSP v3.0.1+ syntax
# Based on official examples from https://github.com/HEnquist/camilladsp-config
#
# To customize:
# 1. Edit this file for your specific audio processing needs
# 2. Reload configuration: ./reload-config.sh
# 3. For help: https://github.com/HEnquist/camilladsp

devices:
  samplerate: 48000
  chunksize: 2048
  enable_rate_adjust: true
  silence_threshold: -60
  silence_timeout: 3.0
  target_level: 2048
  adjust_period: 10

  capture:
    type: Alsa
    channels: 2
    device: "plughw:2,0"
    format: S16LE

  playback:
    type: Alsa
    channels: 2
    device: "hw:CARD=sndrpimerusamp,DEV=0"  # Change this to match your audio hardware
    format: S32LE

# Example filter: Bass shelf (customize frequency, gain, and Q for your needs)
filters:
  lower_gain_to_allow_bass_boost:
    type: Gain
    parameters:
      gain: -24.0
  bass_shelf_120hz:
    type: Biquad
    parameters:
      type: Lowshelf
      freq: 150
      gain: 12.0
      q: 0.7

# Mixer routing both channels
mixers:
  main:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0.0
      - dest: 1
        sources:
          - channel: 1
            gain: 0.0

# Processing pipeline: Filter → Mix (process each channel separately)
pipeline:
  - type: Filter
    channels: [0]
    names:
      - lower_gain_to_allow_bass_boost
      - bass_shelf_120hz
  - type: Filter
    channels: [1]
    names:
      - lower_gain_to_allow_bass_boost
      - bass_shelf_120hz
  - type: Mixer
    name: main
